name: Refresh wine dashboard

on:
  schedule:
    - cron: "7 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dashboard from CellarTracker
        env:
          CELLARTRACKER_USER: ${{ secrets.CELLARTRACKER_USER }}
          CELLARTRACKER_PASSWORD: ${{ secrets.CELLARTRACKER_PASSWORD }}
        run: python build.py

      - name: Commit and push if changed
        run: |
          git config user.name "wine-analytics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html cellar_data.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Automated data refresh"
          git push
